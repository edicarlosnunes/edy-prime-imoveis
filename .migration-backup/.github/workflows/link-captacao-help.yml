name: Link de Captacao - ajuda por inatividade

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  lembrar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Chamar ajuda do Link de Captacao
        shell: bash
        run: |
          set -euo pipefail

          OIDC_RESPONSE="$(curl --fail --silent --show-error             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=edy-prime-link-captacao-help")"

          OIDC_TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$OIDC_RESPONSE")"

          curl --fail --silent --show-error             -H "Authorization: Bearer $OIDC_TOKEN"             "https://www.edyprimeimoveis.com.br/api/cron/link-captacao-help"
