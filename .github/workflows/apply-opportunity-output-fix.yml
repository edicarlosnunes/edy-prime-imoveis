name: Apply opportunity output fix

on:
  push:
    branches:
      - fix/valor-oportunidade
    paths:
      - .github/workflows/apply-opportunity-output-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/valor-oportunidade
      - name: Patch opportunity price usage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected snippet not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace(
              'packages/web/src/web/pages/admin/property-form.tsx',
              '        price: softMoney(form.price),\n        condoFee: softMoney(form.condoFee),',
              '        price: softMoney(form.price),\n        opportunityPrice: softMoney(form.opportunityPrice),\n        condoFee: softMoney(form.condoFee),',
          )

          replace(
              'packages/web/src/api/routes/admin-properties-ai.ts',
              '  price: z.number().min(0).max(999_999_999).nullable().optional(),\n  condoFee:',
              '  price: z.number().min(0).max(999_999_999).nullable().optional(),\n  opportunityPrice: z.number().min(0).max(999_999_999).nullable().optional(),\n  condoFee:',
          )

          replace(
              'packages/web/src/api/routes/admin-properties-ai.ts',
              '  if (input.price && input.price > 0) lines.push(`Preço: ${money(input.price)}`);',
              '  if (input.price && input.price > 0) lines.push(`Valor do imóvel: ${money(input.price)}`);\n  if (input.opportunityPrice && input.opportunityPrice > 0) {\n    lines.push(`Valor de oportunidade: ${money(input.opportunityPrice)}`);\n  }',
          )

          replace(
              'packages/web/src/api/routes/admin-properties-ai.ts',
              '3. Nunca invente número: não crie metragem, quantidade de dormitórios, suítes, banheiros, vagas, valores ou prazos. Se um número não está na ficha, ele não existe.\n4. Não use superlativo vazio',
              '3. Nunca invente número: não crie metragem, quantidade de dormitórios, suítes, banheiros, vagas, valores ou prazos. Se um número não está na ficha, ele não existe.\n3A. PREÇO: quando existir “Valor de oportunidade”, ele é o valor comercial atual e deve ser priorizado em descrição, WhatsApp e portal. Se mencionar os dois valores, use a forma “de [Valor do imóvel] por [Valor de oportunidade]”. Nunca substitua o valor de oportunidade pelo valor do imóvel. Quando não houver valor de oportunidade, use somente o Valor do imóvel.\n4. Não use superlativo vazio',
          )

          replace(
              'packages/web/src/web/pages/admin/properties.tsx',
              '                <p className="display mt-1 text-xl text-deep">{money(property.price)}</p>',
              '''                {property.opportunityPrice &&\n                property.opportunityPrice > 0 &&\n                property.opportunityPrice < property.price ? (\n                  <div className="mt-1">\n                    <Badge tone="brass">OPORTUNIDADE</Badge>\n                    <p className="mt-1 text-xs text-muted">\n                      De <span className="line-through">{money(property.price)}</span>\n                    </p>\n                    <p className="display text-xl text-deep">\n                      Por {money(property.opportunityPrice)}\n                    </p>\n                  </div>\n                ) : (\n                  <p className="display mt-1 text-xl text-deep">{money(property.price)}</p>\n                )}''',
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/web/src/web/pages/admin/property-form.tsx \
                  packages/web/src/api/routes/admin-properties-ai.ts \
                  packages/web/src/web/pages/admin/properties.tsx
          git commit -m "fix: prioritize opportunity value across CRM and AI"
          git push origin HEAD:fix/valor-oportunidade
